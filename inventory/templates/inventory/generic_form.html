{% extends "inventory/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="panel">
  <div class="panel-header">
    <div>
      <div class="eyebrow">Form</div>
      <h2>{{ title }}</h2>
    </div>
    <a class="btn secondary" href="{% url back_url %}">Back</a>
  </div>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Save</button>
  </form>
</div>
{% endblock %}
